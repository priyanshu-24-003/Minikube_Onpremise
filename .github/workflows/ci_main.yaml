name: servant Branch CI Pipeline

# Trigger strictly on pushes to the ingest branch
on:
  push:
    branches:
      - servant

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: servant

      # Step 2: Build the Docker image
      # Passes secrets/env vars as build arguments if needed during image creation
      - name: Build Docker Image
        run: |
          docker build --no-cache -t servant-app .

      - name: Tag Docker image
        run: |
          docker tag servant-app ${{ secrets.DOCKERHUB_USERNAME }}/servant-app:latest
          
      # Step 3: Run the Docker container on the GitHub server
      # -d runs in detached mode, --name gives the container a predictable handle
      - name: Run Docker Container
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          BUCKET: ${{ secrets.BUCKET }}
          docker_user: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker run -d --name servant-app -p 5000:5000 -e AWS_ACCESS_KEY="$AWS_ACCESS_KEY" -e AWS_SECRET_KEY="$AWS_SECRET_KEY" -e BUCKET="$BUCKET" "$docker_user"/servant-app:latest


      # Step 4: Check container health and view logs
      - name: Verify Container Execution
        run: |
          docker ps -a
          echo "=== Container Logs ==="
          docker logs servant-app

      # Step 5: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 6: Push image to Docker Hub
      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/servant-app:latest

