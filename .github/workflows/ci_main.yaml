name: CI Pipeline

# Trigger strictly on pushes to the main branch
on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Global environment variables mapping from GitHub Secrets
    env:
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}

    steps:
      # Step 1: Check out the repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt;

      # Step 4: Automating the Training Pipeline using Github_Actions Server
      - name: Run Data_Ingestion
        env:
          BUCKET: ${{ secrets.BUCKET }}
        run: python trainer_mic1/Ingest/data_ingestion.py 

      - name: Run Model_Training
        env:
          BUCKET: ${{ secrets.BUCKET }}
        run: python trainer_mic1/train/model_trainer.py

      - name: Run Model_Pushing
        env:
          BUCKET: ${{ secrets.BUCKET }}
        run: python trainer_mic1/push/model_pusher.py 

