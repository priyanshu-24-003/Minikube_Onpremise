<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Test App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>predict _____ </h1>
        <form method="POST">
            <label for="attendance"> Attendance </label>
            <input type="text" id="attendance" name="attendance" required>

            <label for="prev_score">Previous Score:</label>
            <input type="text" id="prev_score" name="prev_score" required>

            <button type="submit">Submit</button>
        </form>
        {% if message %}
        <p class="message">{{ message }}</p>
        {% endif %}
    </div>
</body>
</html>
